name: P3.2 Real Fabric Client Startup Smoke

on:
  pull_request:
    paths:
      - 'src/versions/**'
      - 'gradle.properties'
      - 'scripts/setup_gradle_ci.py'
      - 'scripts/run_p32_client_startup.py'
      - 'scripts/run_p33_real_client_e2e.py'
      - 'scripts/minecraft_versions.py'
      - 'versions/**'
      - 'build.gradle'
      - 'src/client/**'
      - 'src/main/java/io/github/fxjcangku/worldseedlab/core/solver/ClientQuartEvidenceArchive.java'
      - '.github/workflows/p32-client-startup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-client-startup:
    name: Actual Fabric runClient startup ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Gradle cache and reports
        uses: gradle/actions/setup-gradle@v4

      - name: Install verified Gradle 9.9.0
        run: python3 -u scripts/setup_gradle_ci.py
      - name: Install isolated virtual display + software OpenGL and EGL
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xauth xdotool scrot x11-utils openbox python3-pil \
            libgl1-mesa-dri libegl1 libegl-mesa0 mesa-utils
      - name: Verify actual Fabric window, texture atlas and rendered frame
        shell: bash
        run: |
          timeout --signal=INT --kill-after=30s 330s \
            /usr/bin/python3 -u scripts/run_p32_client_startup.py --minecraft=${{ matrix.minecraft }}
      - name: Upload controlled startup log and actual window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P32-RunClient-Startup-${{ matrix.minecraft }}
          path: build/p32-client-startup/${{ matrix.minecraft }}/
          retention-days: 7
          if-no-files-found: warn
