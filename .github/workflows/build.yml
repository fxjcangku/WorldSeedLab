name: Fabric Dual-Version Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Compile and verify
        run: gradle --no-daemon --stacktrace -PmcVersion=${{ matrix.minecraft }} clean build

      - name: Upload CI-only artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WorldSeedLab-${{ matrix.minecraft }}-CI
          path: build/libs/*.jar
          if-no-files-found: error

