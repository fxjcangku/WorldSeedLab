name: P3.4 Real Fabric Client Custom Terrain Quart E2E

on:
  pull_request:
    paths:
      - '.github/workflows/p34-real-custom-client.yml'
      - 'scripts/run_p33_real_client_e2e.py'
      - 'scripts/run_p34_custom_worldgen.py'
      - 'src/test/java/io/github/fxjcangku/worldseedlab/core/P34RealFabricCustomClientTest.java'
      - 'src/main/java/io/github/fxjcangku/worldseedlab/core/compatibility/P34WorldgenCompatibilityAudit.java'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-custom-client:
    name: Real Fabric GUI custom-flat client ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2']
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install isolated X11 and actual keyboard interface
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xauth xdotool scrot x11-utils openbox libgl1-mesa-dri mesa-utils
      - name: Real Minecraft Fabric runClient joins custom flat world and types 5 chat sample commands
        run: |
          timeout --signal=INT --kill-after=30s 790s \
            python3 -u scripts/run_p33_real_client_e2e.py --minecraft=${{ matrix.minecraft }} --custom-worldgen
      - name: Cross-check exported CLIENT_OBSERVED against independent saved FULL custom-world Anvil
        run: |
          gradle --no-daemon --console=plain \
            -PmcVersion=${{ matrix.minecraft }} \
            p34RealFabricCustomClientTest
      - name: Upload only public controlled-world E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P34-RealFabricCustomClient-${{ matrix.minecraft }}
          path: build/p34-real-custom-client/${{ matrix.minecraft }}/
          if-no-files-found: warn
          retention-days: 7
