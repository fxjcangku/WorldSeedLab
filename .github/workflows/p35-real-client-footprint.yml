name: P3.5 Real Client-Visible Desert Temple Footprint

on:
  pull_request:
    paths:
      - '.github/workflows/p35-real-client-footprint.yml'
      - 'scripts/run_p35_real_client_footprint.py'
      - 'src/client/java/io/github/fxjcangku/worldseedlab/client/probe/ClientDesertFootprintCaptureController.java'
      - 'src/client/java/io/github/fxjcangku/worldseedlab/client/WorldSeedLabClient.java'
      - 'src/main/java/io/github/fxjcangku/worldseedlab/core/geometry/ClientVisibleDesertPyramidRaster.java'
      - 'src/test/java/io/github/fxjcangku/worldseedlab/core/P35RealFabricClientFootprintTest.java'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-fabric-perimeter:
    name: Actual GUI+server P3.5 ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2']
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install real GUI virtual display and keyboard
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xauth xdotool scrot x11-utils openbox libgl1-mesa-dri mesa-utils z3
      - name: Run actual dedicated Minecraft custom-desert server and actual Fabric GUI
        run: |
          timeout --signal=INT --kill-after=30s 1040s \
            python3 -u scripts/run_p35_real_client_footprint.py --minecraft=${{ matrix.minecraft }}
      - name: Verify real client block raster against independent saved StructureStart and Z3
        run: |
          gradle --no-daemon --console=plain -PmcVersion=${{ matrix.minecraft }} \
            p35RealFabricClientFootprintTest
      - name: Upload public controlled-world test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P35-RealFabricFootprint-${{ matrix.minecraft }}
          path: build/p35-real-client-footprint/${{ matrix.minecraft }}/
          if-no-files-found: warn
          retention-days: 7
