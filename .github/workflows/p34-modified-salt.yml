name: P3.4 Actual Modified Salt StructureSet Worldgen

on:
  pull_request:
    paths:
      - '.github/workflows/p34-modified-salt.yml'
      - 'scripts/run_p34_custom_worldgen.py'
      - 'scripts/run_known_seed_server.py'
      - 'src/test/java/io/github/fxjcangku/worldseedlab/core/P34ModifiedSaltWorldTest.java'
      - 'src/main/java/io/github/fxjcangku/worldseedlab/core/compatibility/P34WorldgenCompatibilityAudit.java'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modified-salt-controlled-world:
    name: Actual Minecraft ${{ matrix.minecraft }} modified structure-set Salt
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2']
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Check Python controlled-world launcher syntax
        run: python3 -m py_compile scripts/run_p34_custom_worldgen.py scripts/run_known_seed_server.py
      - name: Actually enable modified Salt datapack and generate real Minecraft world
        run: |
          timeout --signal=INT --kill-after=30s 640s \
            python3 -u scripts/run_p34_custom_worldgen.py --minecraft=${{ matrix.minecraft }} --modified-salt
      - name: Check independently saved StructureStart NBT under correct and wrong Salt
        run: |
          gradle --no-daemon --console=plain -PmcVersion=${{ matrix.minecraft }} \
            p34ModifiedSaltWorldTest
      - name: Archive only synthetic known-seed world control data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P34-RealModifiedSalt-${{ matrix.minecraft }}
          path: build/p34-modified-salt/${{ matrix.minecraft }}/
          if-no-files-found: warn
          retention-days: 7
