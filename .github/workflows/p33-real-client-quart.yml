name: P3.3 Real Fabric Client Quart Protocol E2E

on:
  pull_request:
    paths:
      - '.github/workflows/p33-real-client-quart.yml'
      - 'scripts/run_p33_real_client_e2e.py'
      - 'src/test/java/io/github/fxjcangku/worldseedlab/core/P33RealFabricClientQuartTest.java'
      - 'src/client/**'
      - 'src/main/java/io/github/fxjcangku/worldseedlab/core/solver/ClientQuartEvidenceArchive.java'
      - 'src/main/java/io/github/fxjcangku/worldseedlab/core/solver/VanillaOverworldBiomeModel.java'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-loopback-multiplayer:
    name: Real Minecraft GUI to local vanilla server ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2']
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install virtual GUI and physical keyboard simulation utilities
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xauth xdotool scrot x11-utils openbox libgl1-mesa-dri mesa-utils
      - name: Start actual Minecraft server and Fabric GUI client and type 5 user commands
        run: |
          timeout --signal=INT --kill-after=30s 670s \
            python3 -u scripts/run_p33_real_client_e2e.py --minecraft=${{ matrix.minecraft }}
      - name: Independently replay actual exported CLIENT_OBSERVED quart CSV
        run: |
          gradle --no-daemon --console=plain \
            -PmcVersion=${{ matrix.minecraft }} \
            -Pp33ClientEvidence=build/p33-real-client/${{ matrix.minecraft }}/controlled-client-quart.csv \
            p33RealFabricClientQuartTest
      - name: Upload controlled evidence and startup diagnostics (no private server)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P33-RealFabricProtocol-${{ matrix.minecraft }}
          path: build/p33-real-client/${{ matrix.minecraft }}/
          if-no-files-found: warn
          retention-days: 7
