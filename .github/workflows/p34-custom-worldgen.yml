name: P3.4 Real Custom Worldgen Structure and Biome Controls

on:
  pull_request:
    paths:
      - '.github/workflows/p34-custom-worldgen.yml'
      - 'scripts/run_p34_custom_worldgen.py'
      - 'scripts/run_known_seed_server.py'
      - 'src/main/java/io/github/fxjcangku/worldseedlab/core/compatibility/P34WorldgenCompatibilityAudit.java'
      - 'src/test/java/io/github/fxjcangku/worldseedlab/core/P34RealCustomWorldTest.java'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-custom-world:
    name: Actual custom-flat terrain and vanilla structure ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2']
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Launch real custom-terrain server and read generated FULL Anvil structures
        run: |
          timeout --signal=INT --kill-after=30s 680s \
            python3 -u scripts/run_p34_custom_worldgen.py --minecraft=${{ matrix.minecraft }}
      - name: Verify actual structure placement and biome model conflict
        run: |
          gradle --no-daemon --console=plain \
            -PmcVersion=${{ matrix.minecraft }} \
            p34RealCustomWorldTest
      - name: Archive controlled local-world proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P34-RealCustomFlat-${{ matrix.minecraft }}
          path: build/p34-controlled/${{ matrix.minecraft }}/
          if-no-files-found: warn
          retention-days: 7
